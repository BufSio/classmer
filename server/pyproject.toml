[project]
name = "classmer"
version = "0.1.0"
description = "Server de Classmer: convierte cada clase grabada en un apunte LaTeX/PDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pillow>=11.0",
    "jsonschema>=4.23",
    "google-genai>=1.0",
    "claude-agent-sdk>=0.2",
    "tzdata>=2024.1",
    "httpx>=0.27",
    "qrcode>=7.4",
    "jinja2>=3.1",
    "ruamel-yaml>=0.18",
    "anthropic>=1.15",
    "pillow-heif>=1.0",
    "pypdf>=5.0",
]

[project.scripts]
classmer = "classmer.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classmer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "latex: necesita pdflatex (MiKTeX)",
    "ffmpeg: necesita ffmpeg/ffprobe",
]
